# Default hyperparameters for environments not explicitly listed
default:
  n_timesteps: !!float 1e6
  policy: 'MlpPolicy'


snake-v0:
  normalize: true
  n_envs: 16
  n_timesteps: !!float 5e6
  policy: 'MlpPolicy'
  n_steps: 16
  gae_lambda: 0.98
  gamma: 0.99
  n_epochs: 4
  ent_coef: 0.0

snake-image-v0:
  n_envs: 8
  n_timesteps: !!float 5e6
  policy: 'CnnPolicy'
  policy_kwargs: "dict(features_extractor_class=importlib.import_module('cnn_features').CnnExtractor, features_extractor_kwargs=dict(features_dim=128), normalize_images=False)"
  n_steps: 128
  batch_size: 64
  n_epochs: 4
  ent_coef: 0.01
  learning_rate: lin_0.0003
  clip_range: lin_0.2
  gamma: 0.99
